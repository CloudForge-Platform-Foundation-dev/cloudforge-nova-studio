name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  governance-gate:
    uses: CloudForge-Platform-Foundation-dev/foundation-validation/.github/workflows/reusable-gate.yml@v1.0.2
    with:
      spec_path: openapi.yaml
      engine_ref: v1.0.2
    secrets:
      foundation_pat: ${{ secrets.FOUNDATION_PAT }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nova-studio:ci .
