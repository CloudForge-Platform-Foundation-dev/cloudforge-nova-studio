openapi: 3.0.3
info:
  title: CloudForge Nova Studio
  description: >-
    Studio ตัวที่สามของ CloudForge Platform — RAG (Retrieval-Augmented Generation):
    รับคำถาม, ดึงเอกสารที่เกี่ยวข้องจาก Knowledge Studio, ส่งให้ LLM ตอบพร้อมอ้างอิงแหล่งที่มา
  version: 0.2.0
  x-owner: nova-team
  x-domain: nova
  x-governance-id: CFG-NOVA-001
  contact:
    name: CloudForge Nova Team
    email: nova@cloudforge.example.com
  license:
    name: MIT
    url: https://github.com/niphan1000-cyber1000/cloudforge-nova-studio/blob/main/LICENSE

servers:
  - url: http://localhost:8002
    description: Local development

tags:
  - name: health
    description: Health/liveness check endpoints
  - name: rag
    description: Retrieval-Augmented Generation — คำถาม-คำตอบพร้อมอ้างอิงเอกสาร

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      description: เช็คว่า service ทำงานอยู่หรือไม่ ใช้สำหรับ liveness/readiness probe
      operationId: getHealth
      tags:
        - health
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /query:
    post:
      summary: ถามคำถามและรับคำตอบแบบ RAG
      description: >-
        รับคำถามจากผู้ใช้ ดึงเอกสารที่เกี่ยวข้องจาก Knowledge Studio (semantic search)
        แล้วส่งให้ LLM สร้างคำตอบพร้อมอ้างอิงแหล่งที่มา
      operationId: postQuery
      tags:
        - rag
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: คำตอบพร้อมแหล่งอ้างอิง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: Token ถูกต้องแต่ไม่มี scope nova:query
        "503":
          description: JWKS endpoint unreachable

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    QueryRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          minLength: 1
          description: คำถามจากผู้ใช้
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: จำนวนเอกสารที่ดึงมาจาก Knowledge Studio

    SourceDocument:
      type: object
      properties:
        text:
          type: string
        source:
          type: string
        score:
          type: number
          format: float

    QueryResponse:
      type: object
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceDocument"
